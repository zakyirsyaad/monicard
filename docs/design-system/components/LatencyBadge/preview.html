<!doctype html>
<html><head><meta charset="utf-8"><title>LatencyBadge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:var(--surface);padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font:500 13px/18px var(--font-mono);font-variant-numeric:tabular-nums}
.blk{color:var(--ink-muted)}
.b{padding:4px 8px;border-radius:var(--radius-sm)}
.fast{background:var(--purple-tint);color:var(--purple-ink)}
.mid{background:var(--surface-sunken);color:var(--ink)}
.slow{background:var(--berry-tint);color:var(--berry)}
.none{background:var(--surface-sunken);color:var(--ink-muted)}
</style></head><body>
<span class="blk">#73,562,481</span><span class="b fast">312 ms</span><span class="b mid">1,240 ms</span><span class="b slow">2,870 ms</span><span class="b none">— ms</span>
</body></html>
