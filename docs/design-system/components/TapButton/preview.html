<!-- @dsCard group="Duel" height=300 subtitle="Countdown, aktif, ditekan" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>TapButton</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:var(--surface);font-family:var(--font-sans);padding:16px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}
.tap{display:flex;align-items:center;justify-content:center;width:100%;height:120px;border:0;border-radius:var(--radius-lg);font:800 40px/44px var(--font-sans);letter-spacing:-.02em;touch-action:manipulation;cursor:pointer}
.tap.active{background:var(--purple);color:var(--on-purple)}
.tap.pressed{background:var(--purple);color:var(--on-purple);transform:scale(.97)}
.tap.wait{background:var(--surface-sunken);color:var(--ink-muted);font-family:var(--font-mono);cursor:default}
.tap:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style></head><body>
<div class="row">
<div><p class="cap">Countdown</p><button class="tap wait" aria-label="Duel starts in 3" disabled>3</button></div>
<div><p class="cap">Aktif</p><button class="tap active" aria-label="Attack">TAP</button></div>
<div><p class="cap">Ditekan</p><button class="tap pressed" aria-label="Attack">TAP</button></div>
</div>
</body></html>
